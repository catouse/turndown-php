name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          - lowest
          - latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: dom, mbstring

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install latest dependencies
        if: matrix.dependencies == 'latest'
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run checks
        run: composer check

  website:
    name: Website
    runs-on: ubuntu-latest
    env:
      TURNDOWN_REQUIRE_SOURCES: '1'
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
          extensions: dom, mbstring

      - name: Install PHP runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Check source
        run: npm run lint && npm run typecheck

      - name: Test runtime setup
        run: npm run test:php-runtime-generation && npm run test:runtime-startup

      - name: Build static website
        run: npm run build:pages

      - name: Test PHP WASM runtime
        run: npm run test:php-wasm

      - name: Build Sites website
        run: npm run build
